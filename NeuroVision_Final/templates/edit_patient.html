{% extends "base.html" %}{% block title %}NeuroVision | Edit patient{% endblock %}
{% block content %}<section class="page-hero"><div class="container"><h1>Edit patient record</h1><p>Administrative correction of stored metadata and model output.</p></div></section><main class="container"><div class="form-card">
<form method="POST"><div class="field"><label>Name</label><input name="name" value="{{ patient[1] }}" maxlength="100" required></div><div class="form-grid"><div class="field"><label>Age</label><input type="number" name="age" value="{{ patient[2] }}" min="1" max="120" required></div><div class="field"><label>Prediction</label><select name="prediction" required><option value="Positive" {{ 'selected' if patient[3]=='Positive' }}>Positive</option><option value="Negative" {{ 'selected' if patient[3]=='Negative' }}>Negative</option></select></div></div><div class="field"><label>Probability (%)</label><input type="number" name="probability" value="{{ patient[4] }}" min="0" max="100" step="0.01" required></div><div class="actions"><button class="btn btn-primary">Save changes</button><a class="btn btn-light" href="{{ url_for('dashboard') }}">Cancel</a></div></form></div></main>{% endblock %}
